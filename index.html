<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
    <a-scene>
      <a-assets>
        <video id="pika" autoplay loop src="pikachu.mp4"></video>
        <img id="rubik" src="rubik.png">
      </a-assets>
        
      <a-video src="#pika" width="16" height="9" position="0 0 -20"></a-video>
      <a-box src="#rubik" position="-1 0.5 -3" rotation="0 45 0"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#FFFFFF"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFFFFF"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#FFFFFF"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
</body>

  
</html>
